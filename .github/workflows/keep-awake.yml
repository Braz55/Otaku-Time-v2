name: Keep Service Awake

on:
  schedule:
    # Every 10 minutes from 05:00 to 23:59 UTC (06:00 Lisbon in summer, 05:00 in winter).
    # Render free sleeps after 15 min idle and GitHub often delays scheduled runs,
    # so 10 min leaves margin. Avoids :00 where GitHub queues are busiest.
    - cron: '3-59/10 5-23 * * *'
    # Every 10 minutes from 00:00 to 01:59 UTC (approx. 01:00 to 03:00 local time)
    - cron: '3-59/10 0-1 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          RENDER_URL="${{ secrets.RENDER_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "========================================= WARNING ========================================="
            echo "RENDER_URL secret is not set in GitHub Repository Secrets!"
            echo "Please set RENDER_URL to your deployment URL (e.g. https://your-app.onrender.com)."
            echo "You can do this in GitHub settings: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "=========================================================================================="
            echo "Exiting gracefully with code 0 to avoid sending failure email notifications."
            exit 0
          fi
          
          # Remove trailing slash if present
          URL="${RENDER_URL%/}"
          echo "Pinging service at $URL..."
          
          # Retry loop to allow Render service to wake up (cold start can take 30-90 seconds)
          MAX_RETRIES=15
          RETRY_DELAY=20
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Ping attempt $i of $MAX_RETRIES..."
            
            # Fetch HTTP status code for /health
            STATUS_CODE=$(curl -sL -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 "$URL/health" || true)
            echo "Service /health returned HTTP status code: $STATUS_CODE"
            
            # If status code is 2xx or 3xx
            if [[ "$STATUS_CODE" =~ ^[23][0-9][0-9]$ ]]; then
              echo "Success! Service is awake."
              exit 0
            fi
            
            # Fallback to root path if health is not found/not working
            STATUS_CODE_ROOT=$(curl -sL -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 "$URL" || true)
            echo "Service root path returned HTTP status code: $STATUS_CODE_ROOT"
            
            if [[ "$STATUS_CODE_ROOT" =~ ^[23][0-9][0-9]$ ]]; then
              echo "Success! Service is awake (via root path)."
              exit 0
            fi
            
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Service not fully awake/ready yet. Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo "Warning: Service failed to wake up after $MAX_RETRIES attempts, but ignoring failure to avoid email notifications."
          exit 0

