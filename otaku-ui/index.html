<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OtakuVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script>
      // Detectar falhas no carregamento de scripts/CSS (ex: cache desatualizado após deploy)
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn("Falha ao carregar recurso estático:", e.target.src || e.target.href);
          const lastReload = localStorage.getItem('otaku_last_reload');
          const now = Date.now();
          // Evitar loop infinito se o servidor estiver realmente indisponível
          if (!lastReload || (now - parseInt(lastReload)) > 15000) {
            localStorage.setItem('otaku_last_reload', now.toString());
            console.log("A recarregar a página para obter recursos novos...");
            window.location.reload();
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-background text-on-background min-h-screen selection:bg-primary selection:text-on-primary">
    <div id="root">
      <!-- Placeholder de Carregamento Premium (Substituído instantaneamente pelo React) -->
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f1014; color: #ba68c8; font-family: 'Outfit', sans-serif; gap: 18px; z-index: 9999;">
        <div style="width: 44px; height: 44px; border: 4px solid rgba(186, 104, 200, 0.1); border-top-color: #ba68c8; border-radius: 50%; animation: otaku-spin 1s linear infinite;"></div>
        <div style="font-weight: 700; font-size: 18px; letter-spacing: -0.025em;">Otaku-Time</div>
        <div style="font-size: 12px; color: #cfc2d7; opacity: 0.7; font-family: 'Inter', sans-serif; text-align: center; max-width: 280px; line-height: 1.5;">
          A carregar aplicação...<br>Se demorar, tente limpar o cache do navegador.
        </div>
        <style>
          @keyframes otaku-spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
