name: Keep Service Awake

on:
  schedule:
    # Runs every 30 minutes from 07:00 to 23:59 UTC
    - cron: '*/30 7-23 * * *'
    # Runs every 30 minutes from 00:00 to 01:59 UTC (approx. 01:00 to 03:00 local time)
    - cron: '*/30 0-1 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          RENDER_URL="${{ secrets.RENDER_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "========================================= WARNING ========================================="
            echo "RENDER_URL secret is not set in GitHub Repository Secrets!"
            echo "Please set RENDER_URL to your deployment URL (e.g. https://your-app.onrender.com)."
            echo "You can do this in GitHub settings: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "=========================================================================================="
            exit 1
          fi
          echo "Pinging service at $RENDER_URL..."
          curl -s -f -I "$RENDER_URL/health" || curl -s -f -I "$RENDER_URL"
